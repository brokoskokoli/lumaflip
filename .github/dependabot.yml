# Keeps the SHA-pinned GitHub Actions in .github/workflows up to date (weekly).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"
