# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the Windows app (preset windows-release) - shared by the CI job "Windows app"
# (checks.yml) and the Windows release job (release.yml), so a release is built exactly like
# the checked build: MSVC developer environment, Qt 6.11.2 msvc2022_64 (tools/fetch_qt_windows.py,
# every archive pinned by SHA-256, cached), vcpkg pinned to a commit with a binary cache
# (vcpkg.json: zlib, libjpeg-turbo, libarchive, GoogleTest), WinSparkle (tools/fetch_winsparkle.py,
# pinned by SHA-256), configure + build. Run after actions/checkout. Sets QT_ROOT_DIR,
# CMAKE_PREFIX_PATH, VCPKG_ROOT, VCPKG_DEFAULT_TRIPLET and LF_VERSION for the later steps.
# No secrets: the EdDSA public key (a repository variable, public anyway) comes as an input.
name: Build Lumaflip for Windows
description: MSVC + Qt + vcpkg + WinSparkle, cmake --preset windows-release, build
inputs:
  cmake-args:
    description: Extra arguments for the configure step (e.g. -DLF_SPARKLE_PUBLIC_KEY=...)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: MSVC developer environment
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: x64
    - name: Restore Qt
      id: qt-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/Qt
        key: qt-win-6.11.2-msvc2022_64-${{ hashFiles('tools/fetch_qt_windows.py') }}
    - name: Install Qt 6.11.2 (msvc2022_64)
      # install-qt-action/aqtinstall do not read the per-architecture repository layout of
      # Qt 6.11 for Windows yet: tools/fetch_qt_windows.py (official repository; every archive
      # checked against the SHA-256 committed in the script).
      shell: pwsh
      run: |
        $qtdir = Join-Path $env:RUNNER_TEMP "Qt"
        if (-not (Test-Path "$qtdir\6.11.2\msvc2022_64\bin\Qt6Core.dll")) {
          python tools/fetch_qt_windows.py 6.11.2 $qtdir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        $prefix = "$qtdir\6.11.2\msvc2022_64"
        "QT_ROOT_DIR=$prefix" >> $env:GITHUB_ENV
        "CMAKE_PREFIX_PATH=$prefix" >> $env:GITHUB_ENV
        "$prefix\bin" >> $env:GITHUB_PATH
    - name: Save Qt
      if: steps.qt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/Qt
        key: qt-win-6.11.2-msvc2022_64-${{ hashFiles('tools/fetch_qt_windows.py') }}
      continue-on-error: true
    - name: vcpkg (pinned)
      shell: pwsh
      env:
        VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d # = builtin-baseline in vcpkg.json
      run: |
        $root = Join-Path $env:RUNNER_TEMP "vcpkg"
        if (-not (Test-Path "$root\vcpkg.exe")) {
          git init -q $root
          git -C $root fetch -q --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_COMMIT
          git -C $root checkout -q FETCH_HEAD
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
        "VCPKG_DEFAULT_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
        $cache = Join-Path $env:RUNNER_TEMP "vcpkg-cache"
        New-Item -ItemType Directory -Force $cache | Out-Null
        "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV
    - name: Restore vcpkg binary cache
      id: vcpkg-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/vcpkg-cache
        key: vcpkg-win-${{ hashFiles('vcpkg.json') }}
    - name: Download WinSparkle (automatic updates, pinned by SHA-256)
      shell: pwsh
      run: |
        python tools/fetch_winsparkle.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Configure
      shell: pwsh
      env:
        LF_CMAKE_ARGS: ${{ inputs.cmake-args }}
      run: |
        # Extra -DNAME=VALUE arguments go into an initial cache file (cmake -C) instead of the
        # command line: PowerShell mangles native arguments such as -DKEY=abc= (a base64 value
        # ending in "=" reached CMake as "-" and "=").
        $init = Join-Path $env:RUNNER_TEMP 'lumaflip-init.cmake'
        Set-Content -Path $init -Value '' -Encoding utf8
        if ($env:LF_CMAKE_ARGS) {
          foreach ($a in ($env:LF_CMAKE_ARGS -split '\s+' | Where-Object { $_ })) {
            if ($a -notmatch '^-D([A-Za-z0-9_]+)(:[A-Z]+)?=(.*)$') { throw "cmake-args: only -DNAME=VALUE is supported, got '$a'" }
            $value = $Matches[3] -replace '\\', '/' -replace '"', '\"'
            Add-Content -Path $init -Value "set($($Matches[1]) `"$value`" CACHE STRING `"`" FORCE)" -Encoding utf8
          }
        }
        cmake -C $init --preset windows-release -DLF_ENABLE_WINSPARKLE=ON
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(Lumaflip VERSION ([0-9.]+)').Matches[0].Groups[1].Value
        "LF_VERSION=$version" >> $env:GITHUB_ENV
    - name: Save vcpkg binary cache
      # Right after the dependencies were built: a failing build/test does not lose them.
      if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/vcpkg-cache
        key: vcpkg-win-${{ hashFiles('vcpkg.json') }}
      continue-on-error: true
    - name: Build
      # -k 0: report every compile error, not only the first one.
      shell: pwsh
      run: |
        cmake --build --preset windows-release -- -k 0
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
