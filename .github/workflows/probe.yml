# Temporary: environment probe for the screenshot workflow (removed before review).
name: Probe
on:
  push:
    branches: [feat/screenshots]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Display modes
        run: |
          cat > modes.swift <<'EOF'
          import CoreGraphics
          import AppKit
          let d = CGMainDisplayID()
          let opts = [kCGDisplayShowDuplicateLowResolutionModes: kCFBooleanTrue] as CFDictionary
          let modes = (CGDisplayCopyAllDisplayModes(d, opts) as? [CGDisplayMode]) ?? []
          for m in modes { print("mode \(m.width)x\(m.height) px \(m.pixelWidth)x\(m.pixelHeight) usable \(m.isUsableForDesktopGUI())") }
          if let cur = CGDisplayCopyDisplayMode(d) { print("current \(cur.width)x\(cur.height) px \(cur.pixelWidth)x\(cur.pixelHeight)") }
          let hidpi = modes.filter { $0.pixelWidth == 2 * $0.width && $0.width >= 1280 }.sorted { $0.width > $1.width }
          let pick = hidpi.first ?? modes.sorted { $0.width > $1.width }.first
          if let m = pick {
            var cfg: CGDisplayConfigRef?
            CGBeginDisplayConfiguration(&cfg)
            CGConfigureDisplayWithDisplayMode(cfg, d, m, nil)
            let err = CGCompleteDisplayConfiguration(cfg, .permanently)
            print("switch to \(m.width)x\(m.height) px \(m.pixelWidth)x\(m.pixelHeight): \(err.rawValue)")
          }
          if let cur = CGDisplayCopyDisplayMode(d) { print("now \(cur.width)x\(cur.height) px \(cur.pixelWidth)x\(cur.pixelHeight)") }
          EOF
          swift modes.swift
          brew install displayplacer >/dev/null 2>&1 && displayplacer list | head -40 || echo "no displayplacer"
          osascript -l JavaScript -e 'ObjC.import("AppKit"); var s=$.NSScreen.mainScreen; JSON.stringify({w:s.frame.size.width,h:s.frame.size.height,scale:s.backingScaleFactor})'
