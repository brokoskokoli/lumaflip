# SPDX-License-Identifier: GPL-3.0-or-later
# Release pipeline (SPEC 10.1): tag v* -> checks -> build -> sign -> notarize -> staple
# -> GitHub Release with DMG, ZIP and SHA-256 files. Required secrets: docs/RELEASING.md.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Only tag builds in the main repository - never for forks or pull requests
    # (secrets are not available there anyway, but the job must not even start).
    if: github.repository == 'brokoskokoli/lumaflip' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    environment: release
    permissions:
      contents: write   # gh release create
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja qt googletest clang-format

      - name: Tag matches project version
        run: |
          version=$(sed -nE 's/^project\(Lumaflip VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CMakeLists.txt version $version"
            exit 1
          fi

      - name: All checks (SPEC 15.1)
        run: tools/check.sh --stage M1

      - name: Import signing certificate into a temporary keychain
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/lumaflip-signing.keychain-db"
          keychain_pw=$(uuidgen)
          echo "::add-mask::$keychain_pw"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pw" "$keychain" >/dev/null
          search=("$keychain")
          while IFS= read -r k; do
            k=$(sed -E 's/^[[:space:]]*"(.*)"[[:space:]]*$/\1/' <<<"$k")
            [[ -n "$k" ]] && search+=("$k")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${search[@]}"
          rm -f "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" \
                     | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -n1)
          if [[ -z "$identity" ]]; then
            echo "::error::No 'Developer ID Application' identity in MACOS_CERT_P12_BASE64"
            exit 1
          fi
          echo "LF_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "LF_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "LF_NOTARY_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple, DMG/ZIP + SHA-256
        env:
          LF_NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          LF_NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: tools/package.sh --notarize

      - name: Check stapled tickets
        run: |
          set -euo pipefail
          for f in dist/*.dmg; do
            xcrun stapler validate "$f"
            spctl --assess --type open --context context:primary-signature -vvv "$f"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "Lumaflip $version" \
            dist/Lumaflip-*.dmg dist/Lumaflip-*.zip dist/Lumaflip-*.sha256

      - name: Remove keychain and API key
        if: always()
        run: |
          [[ -n "${LF_SIGN_KEYCHAIN:-}" ]] && security delete-keychain "$LF_SIGN_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
