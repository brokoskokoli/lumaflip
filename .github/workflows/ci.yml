# SPDX-License-Identifier: GPL-3.0-or-later
# Mandatory checks (SPEC 15.1) on macOS, the platform-neutral core on Linux
# (SPEC 9.3) and REUSE compliance.
name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  check:
    name: macOS checks (M1)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Runners are slower than the reference Mac (SPEC 7): benchmark limits x2.
      LF_BENCH_TOLERANCE: "2.0"
      # RAW samples are downloaded below, so the RAW tests must not skip.
      LF_REQUIRE_RAW: "1"
      # clang-format checks the lines changed against this ref (tools/check.sh).
      LF_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: brew install cmake ninja qt googletest clang-format webp jpeg-xl
      - name: Cache RAW samples
        uses: actions/cache@v4
        with:
          path: tests/corpus/generated/raw
          key: raw-samples-${{ hashFiles('tests/corpus/download_raw.sh') }}
      - name: Download RAW samples (CC0, pinned by SHA-256)
        run: tests/corpus/download_raw.sh
      - name: All checks (build, tests, format, SPDX, spec coverage, benchmarks)
        run: tools/check.sh --stage M1
      - name: clang-tidy on changed files (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          brew install llvm
          PATH="$(brew --prefix llvm)/bin:$PATH" tools/check.sh --quick --tidy
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-macos
          path: |
            build/check/Testing/Temporary/*.log
            build/check/bench.log
          if-no-files-found: warn

  sanitize:
    name: macOS ASan + UBSan
    runs-on: macos-15
    timeout-minutes: 90
    env:
      LF_REQUIRE_RAW: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja qt googletest webp jpeg-xl
      - name: Cache RAW samples
        uses: actions/cache@v4
        with:
          path: tests/corpus/generated/raw
          key: raw-samples-${{ hashFiles('tests/corpus/download_raw.sh') }}
      - name: Download RAW samples
        run: tests/corpus/download_raw.sh
      - name: Build + tests with sanitizers
        run: tools/check.sh --quick --sanitize
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-sanitize
          path: build/sanitize/Testing/Temporary/*.log
          if-no-files-found: warn

  linux-core:
    # SPEC 9.3: the core is compiled and unit-tested on Linux from M1 on, without
    # the app (LF_BUILD_UI=OFF, generic platform layer).
    name: Linux core (generic platform)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang libgtest-dev \
            libgl1-mesa-dev libegl1 libxkbcommon0 libfontconfig1 libglib2.0-0
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          cache: true
      - name: Configure
        run: >
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DLF_BUILD_UI=OFF -DLF_WERROR=ON
      - name: Build
        run: cmake --build build/linux
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/linux --output-on-failure -j "$(nproc)"
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-linux
          path: build/linux/Testing/Temporary/*.log
          if-no-files-found: warn

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: reuse lint
        run: pipx run reuse lint
