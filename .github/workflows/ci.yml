# Mandatory checks (SPEC 15.1) for every push to main and every pull request. The jobs
# themselves live in checks.yml, which release.yml reuses unchanged.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
