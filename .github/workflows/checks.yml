# SPDX-License-Identifier: GPL-3.0-or-later
# Mandatory checks (SPEC 15.1) as a reusable workflow: the same steps for CI (ci.yml:
# push/PR) and for releases (release.yml: the release job needs these jobs), so a
# release is never built with weaker checks than a merge.
# On macOS: build, tests, format (all files), SPDX, spec coverage, benchmarks, clang-tidy
# (changed files, findings fail), ASan/UBSan; the platform-neutral core on Linux
# (SPEC 9.3); the Windows app (build, tests, ZIP + installer); REUSE compliance.
# Actions are pinned by commit SHA (comment = tag). No secrets are passed to this workflow.
name: Checks
on:
  workflow_call:
    inputs:
      code:
        description: "Run the build/test jobs (false: documentation-only change, REUSE only)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Current milestone: spec coverage requires every F-/P-ID up to this stage
  # (tools/check.sh --stage). Raise it here when the next stage starts (M3, M4).
  LF_STAGE: M3
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  check:
    name: macOS checks
    if: inputs.code
    # Newest stable macOS image: the tests expect current ImageIO behaviour (formats such
    # as DICOM, recent RAW cameras, ISO gain map HDR decoding). release.yml builds on
    # macos-15 (deployment target 15.0).
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # Runners are slower than the reference Mac (SPEC 7): benchmark limits x2.
      LF_BENCH_TOLERANCE: "2.0"
      # RAW samples are downloaded below, so the RAW tests must not skip.
      LF_REQUIRE_RAW: "1"
      # Sparkle is downloaded below: the updater tests (F-MAC-08) must run with it.
      LF_REQUIRE_SPARKLE: "1"
      # clang-tidy is installed below: a missing binary fails instead of skipping.
      LF_REQUIRE_TIDY: "1"
      # clang-tidy checks the files changed against this ref (tools/check.sh). For a
      # push it is the previous head; for a tag push GitHub reports no previous head,
      # check.sh then falls back to main/origin/main.
      LF_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        # webp + jpeg-xl: cwebp/cjxl for tests/corpus/make_corpus.sh; llvm: clang-tidy (keg-only,
        # does not shadow clang-format); resvg: SVG backend; jpeg-turbo: lossless JPEG rotation.
        run: |
          brew install cmake ninja qt googletest clang-format webp jpeg-xl llvm resvg jpeg-turbo
          echo "LF_CLANG_TIDY=$(brew --prefix llvm)/bin/clang-tidy" >> "$GITHUB_ENV"
      - name: Restore RAW samples
        id: raw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/corpus/generated/raw
          key: raw-samples-${{ hashFiles('tests/corpus/download_raw.sh') }}
      - name: Download RAW samples (CC0, pinned by SHA-256)
        run: tests/corpus/download_raw.sh
      - name: Save RAW samples
        # Saved right after the download, so a failing test step does not lose the cache.
        if: steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/corpus/generated/raw
          key: raw-samples-${{ hashFiles('tests/corpus/download_raw.sh') }}
        continue-on-error: true # the other macOS job may have saved the same key first
      - name: Download Sparkle (F-MAC-08, pinned by SHA-256)
        run: tools/fetch_sparkle.sh
      - name: Require Finder fixtures once they exist (F-SORT-08)
        # tools/make_finder_fixtures.sh writes tests/data/finder/macos-<n>/ on a real Mac;
        # from then on a missing or unreadable fixture set fails instead of skipping.
        run: |
          if [[ -d tests/data/finder ]]; then
            echo "LF_REQUIRE_FINDER_FIXTURES=1" >> "$GITHUB_ENV"
            echo "Finder fixtures present: LF_REQUIRE_FINDER_FIXTURES=1"
          else
            echo "No tests/data/finder yet - the Finder fixture test skips"
          fi
      - name: All checks (build, tests, format, SPDX, spec coverage, benchmarks, clang-tidy)
        run: tools/check.sh --stage "$LF_STAGE" --format-all --tidy
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-macos
          path: |
            build/check/Testing/Temporary/*.log
            build/check/bench.log
          if-no-files-found: warn

  sanitize:
    name: macOS ASan + UBSan
    if: inputs.code
    runs-on: macos-26
    timeout-minutes: 90
    env:
      LF_REQUIRE_RAW: "1"
      LF_REQUIRE_SPARKLE: "1"
      # ASan/UBSan on a shared runner: timing limits of the unit tests x4.
      LF_TIMING_FACTOR: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: brew install cmake ninja qt googletest webp jpeg-xl resvg jpeg-turbo
      - name: Restore RAW samples
        id: raw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/corpus/generated/raw
          key: raw-samples-${{ hashFiles('tests/corpus/download_raw.sh') }}
      - name: Download RAW samples
        run: tests/corpus/download_raw.sh
      - name: Save RAW samples
        # Saved right after the download, so a failing test step does not lose the cache.
        if: steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/corpus/generated/raw
          key: raw-samples-${{ hashFiles('tests/corpus/download_raw.sh') }}
        continue-on-error: true # the other macOS job may have saved the same key first
      - name: Download Sparkle (F-MAC-08, pinned by SHA-256)
        run: tools/fetch_sparkle.sh
      - name: Require Finder fixtures once they exist (F-SORT-08)
        run: |
          if [[ -d tests/data/finder ]]; then echo "LF_REQUIRE_FINDER_FIXTURES=1" >> "$GITHUB_ENV"; fi
      - name: Build + tests with sanitizers
        run: tools/check.sh --quick --sanitize
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-sanitize
          path: build/sanitize/Testing/Temporary/*.log
          if-no-files-found: warn

  linux-core:
    # SPEC 9.3: the core is compiled and unit-tested on Linux from M1 on, without
    # the app (LF_BUILD_UI=OFF, generic platform layer).
    name: Linux core (generic platform)
    if: inputs.code
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          # libarchive-dev: archives (F-OPEN-10). Optional backends stay off here: Ubuntu
          # 24.04 ships TurboJPEG 2.1 (the core needs the 3.x API) and no resvg package
          # (building it with cargo is slow).
          sudo apt-get install -y --no-install-recommends ninja-build clang libgtest-dev \
            libarchive-dev libgl1-mesa-dev libegl1 libxkbcommon0 libfontconfig1 libglib2.0-0
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.11.*"
          # TIFF etc. for the tests that write images (the macOS build has them via Homebrew).
          modules: qtimageformats
          cache: true
      - name: Configure
        run: >
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DLF_BUILD_UI=OFF -DLF_WERROR=ON
      - name: Build
        # -k 0: report every compile error, not only the first one.
        run: cmake --build build/linux -- -k 0
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          # Shared runners: timing limits of the unit tests x2.
          LF_TIMING_FACTOR: "2"
        run: ctest --test-dir build/linux --output-on-failure -j "$(nproc)"
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-linux
          path: build/linux/Testing/Temporary/*.log
          if-no-files-found: warn

  windows:
    # M4: the app on Windows 10/11 (src/platform/windows, docs/WINDOWS.md): MSVC + Qt
    # msvc2022_64, vcpkg (vcpkg.json) for zlib/libjpeg-turbo/libarchive/GoogleTest with a
    # binary cache. Unit and integration tests (real windows, D3D11/WARP), then the
    # deployed folder (windeployqt), a portable ZIP and the Inno Setup installer.
    name: Windows app
    if: inputs.code
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d # = builtin-baseline in vcpkg.json
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
      # Shared runners: timing limits of the tests x2.
      LF_TIMING_FACTOR: "2"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Restore Qt
        id: qt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-win-6.11.2-msvc2022_64-${{ hashFiles('tools/fetch_qt_windows.py') }}
      - name: Install Qt 6.11.2 (msvc2022_64)
        # install-qt-action/aqtinstall do not read the per-architecture repository layout of
        # Qt 6.11 for Windows yet: tools/fetch_qt_windows.py (official repository, SHA-1 checked).
        run: |
          $qtdir = Join-Path $env:RUNNER_TEMP "Qt"
          if (-not (Test-Path "$qtdir\6.11.2\msvc2022_64\bin\Qt6Core.dll")) {
            python tools/fetch_qt_windows.py 6.11.2 $qtdir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $prefix = "$qtdir\6.11.2\msvc2022_64"
          "QT_ROOT_DIR=$prefix" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$prefix" >> $env:GITHUB_ENV
          "$prefix\bin" >> $env:GITHUB_PATH
      - name: Save Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-win-6.11.2-msvc2022_64-${{ hashFiles('tools/fetch_qt_windows.py') }}
        continue-on-error: true
      - name: vcpkg (pinned)
        run: |
          $root = Join-Path $env:RUNNER_TEMP "vcpkg"
          git init -q $root
          git -C $root fetch -q --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_COMMIT
          git -C $root checkout -q FETCH_HEAD
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          $cache = Join-Path $env:RUNNER_TEMP "vcpkg-cache"
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV
          "LF_VCPKG_CACHE=$cache" >> $env:GITHUB_ENV
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-win-${{ hashFiles('vcpkg.json') }}
      - name: Configure
        run: cmake --preset windows-release
      - name: Save vcpkg binary cache
        # Right after the dependencies were built: a failing build/test does not lose them.
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-win-${{ hashFiles('vcpkg.json') }}
        continue-on-error: true
      - name: Build
        id: build
        # -k 0: report every compile error, not only the first one.
        run: cmake --build --preset windows-release -- -k 0
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/windows-release -L unit --output-on-failure -j 4 --timeout 300
      - name: Integration tests
        # Real windows on the runner's desktop; QRhi uses D3D11 (WARP without a GPU). Also
        # after failed unit tests (independent results; the job fails either way).
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          QT_QPA_PLATFORM: windows
        run: ctest --test-dir build/windows-release -L integration --output-on-failure -j 2 --timeout 900
      - name: Deploy (windeployqt)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python tools/windows_deploy.py build/windows-release dist/Lumaflip `
            --vcpkg-installed build/windows-release/vcpkg_installed/$env:VCPKG_DEFAULT_TRIPLET
      - name: Smoke test of the deployed app
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # The deployed helper starts sandboxed and decodes (Qt plugins from the deployed folder).
        run: python tools/windows_smoke.py dist/Lumaflip
      - name: Portable ZIP
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(Lumaflip VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "LF_VERSION=$version" >> $env:GITHUB_ENV
          Compress-Archive -Path dist/Lumaflip -DestinationPath "dist/Lumaflip-$version-windows-x64.zip"
      - name: Installer (Inno Setup)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Qp "/DAppVersion=$env:LF_VERSION" "/DSourceDir=$PWD\dist\Lumaflip" "/DOutputDir=$PWD\dist" `
            "/DIconFile=$PWD\build\windows-release\packaging\Lumaflip.ico" packaging\windows\Lumaflip.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - name: Upload app (ZIP + installer)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumaflip-windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-windows
          path: build/windows-release/Testing/Temporary/*.log
          if-no-files-found: warn

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: reuse lint
        run: pipx run reuse lint
