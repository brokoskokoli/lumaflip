<!-- Lumaflip app icon (source). Rendered to Lumaflip.icns by tools/make_icon.sh, to the
     Windows .ico by src/platform/windows/tools/MakeIco.cpp (Qt SVG) and to the Linux hicolor
     PNGs by src/CMakeLists.txt (rsvg-convert). One-colour glyph: packaging/brand/lumaflip-mono.svg. -->
<!-- Motif "Sun Chevron": a bold white "next" chevron (flip to the next photo, arrow keys) with a
     glowing sun (luma, light) nestled in its opening, on a teal body. -->
<!-- Only features that rsvg-convert, resvg and Qt SVG all render: gradients and feGaussianBlur
     (no feDropShadow; shadows are blurred copies of the shapes). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- macOS 11+ icon grid: 824 x 824 body centred on the 1024 canvas, ~185 px corner radius -->
    <linearGradient id="body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#14A3A8"/>
      <stop offset="0.55" stop-color="#0D5E78"/>
      <stop offset="1" stop-color="#0A2342"/>
    </linearGradient>
    <radialGradient id="warmth" cx="0.45" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE7A3" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- halo around the sun (radius 240; the sun itself has radius 132) -->
    <radialGradient id="halo" cx="460" cy="512" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0.5" stop-color="#FFE9A0" stop-opacity="0.75"/>
      <stop offset="0.71" stop-color="#FFE9A0" stop-opacity="0.38"/>
      <stop offset="0.86" stop-color="#FFE9A0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFE9A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFFDF0"/>
      <stop offset="0.6" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FFC23D"/>
    </radialGradient>
    <linearGradient id="chevron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3F6F7"/>
    </linearGradient>
    <filter id="bodyShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="chevronShadow" filterUnits="userSpaceOnUse" x="240" y="120" width="600" height="820">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- body with its shadow, a warm glow towards the sun and a faint light rim -->
  <rect x="100" y="110" width="824" height="824" rx="185" fill="#000000" fill-opacity="0.30"
        filter="url(#bodyShadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#warmth)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <!-- the sun, cradled by the chevron -->
  <circle cx="460" cy="512" r="240" fill="url(#halo)"/>
  <circle cx="460" cy="512" r="132" fill="url(#sun)"/>

  <!-- the bold "next" chevron with its shadow -->
  <path d="M412 282 L 656 526 L 412 770" fill="none" stroke="#03141F" stroke-opacity="0.45"
        stroke-width="116" stroke-linecap="round" stroke-linejoin="round" filter="url(#chevronShadow)"/>
  <path d="M412 268 L 656 512 L 412 756" fill="none" stroke="url(#chevron)" stroke-width="116"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
