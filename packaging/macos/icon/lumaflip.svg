<!-- Lumaflip app icon (source). Rendered to Lumaflip.icns by tools/make_icon.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- macOS 11+ icon grid: 824 x 824 body centred on the 1024 canvas, ~185 px corner radius -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4CCA"/>
      <stop offset="1" stop-color="#1B1F5E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#7FD3FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7FD3FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD8FF"/>
      <stop offset="1" stop-color="#FFE3A8"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4DA88A"/>
      <stop offset="1" stop-color="#2F7A66"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E8C6E"/>
      <stop offset="1" stop-color="#1D5E4D"/>
    </linearGradient>
    <linearGradient id="backCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9ECFF"/>
      <stop offset="1" stop-color="#B9C0F2"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF9F43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B0E33" flood-opacity="0.45"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <clipPath id="photo">
      <rect x="292" y="300" width="440" height="340" rx="18"/>
    </clipPath>
  </defs>

  <!-- body -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>
  </g>

  <!-- card behind: tilted, the "next" image -->
  <g transform="rotate(-9 512 520)" filter="url(#shadow)">
    <rect x="268" y="262" width="488" height="388" rx="30" fill="url(#backCard)"/>
  </g>

  <!-- front photo -->
  <g transform="rotate(4 512 500)" filter="url(#shadow)">
    <rect x="268" y="276" width="488" height="388" rx="30" fill="#FFFFFF"/>
    <g clip-path="url(#photo)">
      <rect x="292" y="300" width="440" height="340" fill="url(#sky)"/>
      <circle cx="628" cy="390" r="44" fill="#FFF4D6"/>
      <circle cx="628" cy="390" r="44" fill="#FFC857" fill-opacity="0.55"/>
      <path d="M292 560 C 380 470, 450 470, 540 540 S 690 520, 732 500 L 732 640 L 292 640 Z"
            fill="url(#hillBack)"/>
      <path d="M292 600 C 390 540, 470 560, 560 600 S 690 590, 732 570 L 732 640 L 292 640 Z"
            fill="url(#hillFront)"/>
    </g>
  </g>

  <!-- flip motif: a light arc sweeping from the front photo towards the next one -->
  <g filter="url(#shadow)">
    <path d="M 300 760 C 420 846, 630 846, 744 742" fill="none" stroke="url(#arrow)"
          stroke-width="34" stroke-linecap="round"/>
    <path d="M 790 700 L 760 806 L 676 760 Z" fill="#FF9F43" stroke="#FF9F43"
          stroke-width="16" stroke-linejoin="round"/>
  </g>
</svg>
