<!-- Lumaflip one-colour glyph (brand asset): the "Sun Chevron" of the app icon
     (packaging/macos/icon/lumaflip.svg) without the body - the "next" chevron with the sun in
     its opening, separated by a knocked-out gap so it works in any single colour (favicon-like
     uses, docs, a macOS template image). Recolour by changing #000000 (both fills). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- the chevron plus a 46 px gap around it is cut out of the sun -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <path d="M348.5 146 L 714.5 512 L 348.5 878" fill="none" stroke="#000000" stroke-width="266"
            stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <circle cx="420.5" cy="512" r="198" fill="#000000" mask="url(#gap)"/>
  <path d="M348.5 146 L 714.5 512 L 348.5 878" fill="none" stroke="#000000" stroke-width="174"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
